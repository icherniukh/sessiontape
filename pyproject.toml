[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "sessiontape"
dynamic = ["version"]
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["psutil>=7,<8"]

[project.scripts]
sessiontape = "src.__main__:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src"]
