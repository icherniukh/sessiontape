name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run pytest
        run: uv run --with pytest pytest tests/ -v

  build-mac-capture:
    # macos-15 = Xcode 16 / macOS 15 SDK;
    # macos-26 = Xcode 26 SDK, which compiles the bundleIDs tap path.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Build Swift capture binary
        run: |
          swift --version
          cd mac-capture && swift build -c release

      - name: Test Swift capture binary
        run: cd mac-capture && swift test

  build-windows-capture:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Build and test Windows capture binary
        shell: pwsh
        run: ./windows-capture/build.ps1 -RunTests
