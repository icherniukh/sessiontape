name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install pytest

      - name: Run pytest
        run: |
          source .venv/bin/activate
          uv run pytest tests/ -v

  build-mac-capture:
    # macos-15 = Xcode 16 / macOS 15 SDK (what release.yml's macos-latest uses today);
    # macos-26 = Xcode 26 SDK, which compiles the bundleIDs tap path.
    strategy:
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Build Swift helper
        run: |
          swift --version
          cd mac-capture && swift build -c release
