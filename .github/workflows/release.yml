name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build_release:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install pyinstaller

      - name: Install Certificates
        uses: apple-actions/import-codesign-certs@v6
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}

      - name: Build Executable
        run: |
          source .venv/bin/activate
          bash scripts/build.sh --full

      - name: Code Sign Binary
        run: |
          xcrun codesign --force --options runtime --timestamp \
            --entitlements entitlements.plist \
            --sign "Developer ID Application" dist/rb-recorder-bin

      - name: Package Release
        run: |
          mkdir -p release_package
          cp dist/rb-recorder-bin release_package/auto-rb-recorder
          cp config.default.toml release_package/
          cd release_package
          zip -r ../auto-rb-recorder-macos-universal.zip *

      - name: Upload Release
        uses: softprops/action-gh-release@v2.6.1
        with:
          files: auto-rb-recorder-macos-universal.zip
          generate_release_notes: true

      - name: Update Homebrew Tap
        uses: mislav/bump-homebrew-formula-action@v4.1
        with:
          formula-name: auto-rb-recorder
          homebrew-tap: icherniukh/homebrew-tap
          base-branch: main
          download-url: https://github.com/icherniukh/auto-rb-recorder/releases/download/${{ github.ref_name }}/auto-rb-recorder-macos-universal.zip
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  build_windows_release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          uv venv
          .venv\Scripts\activate
          uv pip install pyinstaller

      - name: Build and Package
        run: |
          .venv\Scripts\activate
          powershell -ExecutionPolicy Bypass -File scripts\build-windows.ps1

      - name: Upload Release
        uses: softprops/action-gh-release@v2.6.1
        with:
          files: dist/auto-rb-recorder-setup.exe
          generate_release_notes: true
