name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  test_macos:
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install pytest

      - name: Run pytest
        run: |
          source .venv/bin/activate
          uv run pytest tests/ -v

  test_windows:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          uv venv
          .venv\Scripts\activate
          uv pip install pytest

      - name: Run pytest
        run: |
          .venv\Scripts\activate
          uv run pytest tests/ -v

  gate:
    needs: [test_macos, test_windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: All platform tests passed
        run: echo "Both macOS and Windows test suites passed"

  build_release:
    needs: gate
    runs-on: macos-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install pyinstaller

      - name: Install Certificates
        uses: apple-actions/import-codesign-certs@v6
        with:
          p12-file-base64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.MACOS_CERTIFICATE_PWD }}

      - name: Build Executable
        run: |
          source .venv/bin/activate
          bash scripts/build.sh --full

      - name: Code Sign Binary
        run: |
          xcrun codesign --force --options runtime --timestamp \
            --entitlements entitlements.plist \
            --sign "Developer ID Application" dist/sessiontape

      - name: Package Release
        run: |
          mkdir -p release_package
          cp dist/sessiontape release_package/
          cp config.default.toml release_package/
          cd release_package
          zip -r ../sessiontape-macos-universal.zip *
          cd ..
          shasum -a 256 sessiontape-macos-universal.zip > sessiontape-macos-universal.zip.sha256

      - name: Upload Release
        uses: softprops/action-gh-release@v2.6.1
        with:
          files: |
            sessiontape-macos-universal.zip
            sessiontape-macos-universal.zip.sha256
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}

      - name: Update Homebrew Tap
        if: ${{ !contains(github.ref_name, '-rc') && !contains(github.ref_name, '-beta') }}
        uses: mislav/bump-homebrew-formula-action@v4.1
        with:
          formula-name: sessiontape
          homebrew-tap: icherniukh/homebrew-tap
          base-branch: main
          download-url: https://github.com/icherniukh/sessiontape/releases/download/${{ github.ref_name }}/sessiontape-macos-universal.zip
        env:
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  build_windows_release:
    needs: gate
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          uv venv
          .venv\Scripts\activate
          uv pip install pyinstaller

      - name: Install WiX Toolset
        run: dotnet tool install --global wix

      - name: Build and Package
        run: |
          .venv\Scripts\activate
          powershell -ExecutionPolicy Bypass -File scripts\build-windows.ps1
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1

      - name: Generate Checksums
        shell: pwsh
        run: |
          Get-FileHash dist\sessiontape.msi -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  sessiontape.msi" } |
            Set-Content dist\sessiontape.msi.sha256
          if (Test-Path dist\sessiontape-setup.exe) {
            Get-FileHash dist\sessiontape-setup.exe -Algorithm SHA256 |
              ForEach-Object { "$($_.Hash)  sessiontape-setup.exe" } |
              Set-Content dist\sessiontape-setup.exe.sha256
          }

      - name: Collect Release Assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item dist\sessiontape.msi release-assets\
          Copy-Item dist\sessiontape.msi.sha256 release-assets\
          if (Test-Path dist\sessiontape-setup.exe) {
            Copy-Item dist\sessiontape-setup.exe release-assets\
            Copy-Item dist\sessiontape-setup.exe.sha256 release-assets\
          }

      - name: Upload Release
        uses: softprops/action-gh-release@v2.6.1
        with:
          files: release-assets/*
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
