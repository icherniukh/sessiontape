# config.default.toml — SessionTape defaults
# Windows: copy to %APPDATA%\sessiontape\config.toml
# macOS:   copy to ~/Library/Application Support/sessiontape/config.toml

[recording]
sample_rate = 48000
output_dir = "~/Music/sessiontape"
export_format = "wav"  # allow "wav" or "mp3"

[trigger]
silence_threshold_db = -50
min_silence_duration = 15
min_segment_duration = 30
decay_tail = 5

[monitor]
process_name = "rekordbox"
poll_interval = 2.0
